# Every push and pull request: the plug-in built and tested on Windows (with the VST3 validator), the core and its
# tests on Linux, and the macOS bundle (experimental until it has been tried on a Mac).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (plug-in, tests, validator)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Dependencies (pinned versions)
        shell: pwsh
        run: tools/fetch_deps.ps1
      - name: 'Web UI: install, types, tests'
        working-directory: webui
        run: |
          npm ci
          npm run typecheck
          npx vitest run
      - name: Build (web UI, Plenio.vst3, tests; the validator runs after the plug-in)
        shell: pwsh
        run: tools/build.ps1
      - name: Unit tests
        shell: pwsh
        run: build/bin/Release/plenio_tests.exe
      - name: The DAW guide in docs/ matches the plug-in's
        run: python tools/docs/make_daws_md.py --check
      - name: Package (portable zip)
        shell: pwsh
        run: tools/package.ps1 -NoInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: plenio-vst3-windows-x64
          path: dist/*.zip
          retention-days: 14

  linux:
    name: Linux (core and tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (pinned versions)
        shell: pwsh
        run: tools/fetch_deps.ps1
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_RUN_VST_VALIDATOR=OFF -DPLENIO_BUILD_WEBUI=OFF
      - name: Build the tests
        run: cmake --build build --target plenio_tests --parallel
      - name: Unit tests
        run: build/bin/Release/plenio_tests

  macos:
    name: macOS (universal bundle, experimental)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Dependencies (pinned versions)
        shell: pwsh
        run: tools/fetch_deps.ps1
      - name: Web UI
        working-directory: webui
        run: npm ci
      - name: Configure (arm64 and x86_64, macOS 13.3 or newer)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DSMTG_BUILD_UNIVERSAL_BINARY=OFF
      - name: Build (the validator runs after the plug-in)
        run: cmake --build build --parallel
      - name: Unit tests
        run: build/bin/Release/plenio_tests
      - name: Package
        run: |
          chmod +x installer/macos/build_pkg.sh
          version=$(sed -n 's/#define PLENIO_VERSION_STRING "\(.*\)"/\1/p' build/generated/plenio_version.h)
          installer/macos/build_pkg.sh build/VST3/Release/Plenio.vst3 "$version" dist
      - uses: actions/upload-artifact@v4
        with:
          name: plenio-vst3-macos-universal
          path: dist/*
          retention-days: 14
